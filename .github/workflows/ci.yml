name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend-ci.yml
    permissions:
      contents: read
      pull-requests: write

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend-ci.yml
    permissions:
      contents: read
      pull-requests: write

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
